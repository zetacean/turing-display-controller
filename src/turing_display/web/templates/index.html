{% extends "base.html" %}

{% block heading %}Turing Display Controller — Dashboard{% endblock %}

{% block content %}
<div class="grid">
    <div class="card">
        <h2>Estado</h2>
        <div id="status">
            <p>Modo actual: <strong id="current-mode">{{ mode }}</strong></p>
            <p>Cola de notificaciones: <strong id="queue-size">{{ queue_size }}</strong></p>
        </div>
    </div>

    <div class="card">
        <h2>Modo</h2>
        <div class="modes">
            <button data-mode="slideshow" class="mode-btn">Slideshow</button>
            <button data-mode="spotify" class="mode-btn">Spotify</button>
            <button data-mode="mix" class="mode-btn">Mix</button>
        </div>
    </div>

    <div class="card">
        <h2>Notificación Push</h2>
        <label for="notif-message">Mensaje</label>
        <textarea id="notif-message" rows="3" placeholder="Texto a mostrar"></textarea>
        <label for="notif-duration">Duración (s)</label>
        <input type="number" id="notif-duration" value="5" min="1" max="60">
        <p><button id="push-notif">Enviar notificación</button></p>
    </div>

    <div class="card">
        <h2>Frases (modo Mix)</h2>
        <label for="phrase-text">Texto</label>
        <textarea id="phrase-text" rows="2"></textarea>
        <label for="phrase-author">Autor</label>
        <input type="text" id="phrase-author">
        <label for="phrase-category">Categoría</label>
        <input type="text" id="phrase-category">
        <p><button id="add-phrase">Añadir frase</button></p>
    </div>

    <div class="card" style="grid-column: 1 / -1;">
        <h2>Log de eventos (WebSocket)</h2>
        <pre id="log" class="log"></pre>
    </div>
</div>
{% endblock %}
