<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Turing Display Controller{% endblock %}</title>
    <style>
        :root {
            color-scheme: dark light;
            --bg: #111;
            --fg: #f0f0f0;
            --accent: #00d4ff;
            --card: #1d1d1d;
            --border: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            margin: 0;
            padding: 1.5rem;
        }
        h1 { color: var(--accent); margin-top: 0; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
        }
        button, select, input, textarea {
            background: #222;
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.5rem 0.75rem;
            font-size: 0.95rem;
            font-family: inherit;
        }
        button {
            cursor: pointer;
            background: var(--accent);
            color: #000;
            border: none;
            font-weight: 600;
        }
        button:hover { filter: brightness(1.1); }
        button.danger { background: #ff5050; color: #fff; }
        .modes button { margin-right: 0.4rem; margin-bottom: 0.4rem; }
        .modes button.active { background: #fff; color: #000; }
        label { display: block; margin-top: 0.5rem; font-size: 0.85rem; opacity: 0.85; }
        pre { background: #000; padding: 0.5rem; border-radius: 4px; overflow: auto; max-height: 200px; }
        .log { font-family: monospace; font-size: 0.8rem; }
        .log .info  { color: #4dff4d; }
        .log .error { color: #ff4d4d; }
        .log .ack   { color: var(--accent); }
    </style>
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/app.js" defer></script>
    {% block head %}{% endblock %}
</head>
<body>
    <h1>{% block heading %}Turing Display Controller{% endblock %}</h1>
    {% block content %}{% endblock %}
</body>
</html>
