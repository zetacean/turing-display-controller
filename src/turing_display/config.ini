[display]
com_port = AUTO
brightness = 70
orientation = landscape
rotation = 90
reset_on_startup = false

[modes]
default_mode = slideshow
transition_ms = 5000
mix_image_ms = 4000
mix_phrase_ms = 6000

[spotify]
client_id =
redirect_uri = http://localhost:8000/api/spotify/callback
poll_interval_s = 5
idle_timeout_s = 30
cache_dir = ./cache/spotify

[phrases]
db_path = ./data/phrases.db

[notifications]
default_duration_s = 5
max_queue_size = 32

[server]
host = 0.0.0.0
port = 8000

[paths]
images_dir = ./images
