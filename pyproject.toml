[project]
name = "turing-display-controller"
version = "0.1.0"
description = "Controlador Python multiplataforma para pantallas Turing Smart Display 3.5\""
authors = [{ name = "Gustavo López", email = "zetacean@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "aiosqlite>=0.20",
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=2",
    "pillow>=11",
    "pyserial>=3.5",
    "python-multipart>=0.0.20",
    "spotipy>=2.24",
    "uvicorn[standard]>=0.32",
    "watchdog>=6.0.0",
]

[project.scripts]
turing-display-controller = "turing_display.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turing_display"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.12"

[tool.ty.rules]
unsupported-base = "warn"
possibly-unresolved-reference = "warn"
invalid-argument-type = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "hatchling>=1.32.0",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]
