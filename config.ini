[display]
com_port = AUTO
brightness = 70
orientation = portrait
reset_on_startup = false

[modes]
default_mode = slideshow
transition_ms = 5000
mix_image_ms = 4000
mix_phrase_ms = 6000

[spotify]
client_id = 168d25cebdcc45c1a58594638a338a0d
redirect_uri = http://127.0.0.1:8000/api/spotify/callback
poll_interval_s = 5
idle_timeout_s = 30
cache_dir = /var/lib/turing-display/cache/spotify

[phrases]
db_path = /var/lib/turing-display/phrases.db

[notifications]
default_duration_s = 5
max_queue_size = 32

[server]
host = 0.0.0.0
port = 8000

[paths]
# IMPORTANTE: ~/ se expande a /root cuando el servicio corre como root.
# Usa siempre rutas absolutas. /home/<user>/images permite al usuario
# subir fotos por SCP/SFTP sin sudo, y al servicio leerlas como root.
images_dir = /home/orangepi/images
phrases_db = /var/lib/turing-display/phrases.db
